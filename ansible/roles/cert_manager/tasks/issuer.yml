---
# Runs after acme_dns has created acmedns-secret (see acme_dns/tasks/main.yml).
- name: Create the ClusterIssuer
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('ansible.builtin.template', 'clusterissuer.yml.j2') | ansible.builtin.from_yaml }}"

- name: Request the certificates
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: "{{ item.name }}"
        namespace: "{{ item.namespace | default('default') }}"
      spec:
        secretName: "{{ item.secret_name }}"
        issuerRef:
          name: "{{ cert_manager_issuer_name }}"
          kind: ClusterIssuer
        dnsNames: "{{ item.dns_names }}"
  loop: "{{ cert_manager_certificates }}"
  loop_control:
    label: "{{ item.name }}"
