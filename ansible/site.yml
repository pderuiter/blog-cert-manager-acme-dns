---
- name: Single-node k3s cluster
  hosts: k8s
  pre_tasks:
    - name: Refresh the apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_facts['os_family'] == 'Debian'
  roles:
    - role: k3s

- name: Traefik, cert-manager and ACME-DNS
  hosts: k8s
  vars:
    # kubernetes.core needs a newer kubernetes client than Ubuntu ships (see the k3s role).
    ansible_python_interpreter: "{{ k3s_python_venv }}/bin/python"
  environment:
    K8S_AUTH_KUBECONFIG: "{{ k3s_kubeconfig }}"
  roles:
    - role: traefik_ingress
    - role: cert_manager
    - role: acme_dns
  tasks:
    - name: ClusterIssuer and certificates
      ansible.builtin.include_role:
        name: cert_manager
        tasks_from: issuer
